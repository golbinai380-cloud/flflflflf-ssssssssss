<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#141414">
    <title>Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ПОЛНАЯ ИЗОЛЯЦИЯ СТИЛЕЙ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #141414;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            padding: 20px;
            padding-bottom: 80px;
        }

        .admin-panel {
            max-width: 800px;
            margin: 0 auto;
        }

        .panel-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .panel-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            overflow-x: auto;
        }

        .tab {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            width: 100%;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .user-card,
        .worker-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-info {
            flex: 1;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
        }

        .card-id {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .btn-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .btn-primary {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
        }

        .btn-block {
            width: 100%;
            padding: 14px;
            font-size: 15px;
        }

        .broadcast-form {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            width: 100%;
            font-size: 14px;
            font-family: inherit;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-blocked {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .ri-loader-4-line {
            animation: spin 1s linear infinite;
        }
    </style>
</head>

<body>
    <div class="admin-panel">
        <div class="panel-header">
            <h1 class="panel-title">👑 Admin Panel</h1>
            <p class="panel-subtitle">Полное управление системой</p>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="stats">Статистика</button>
            <button class="tab" data-tab="users">Пользователи</button>
            <button class="tab" data-tab="workers">Воркеры</button>
            <button class="tab" data-tab="broadcast">Рассылка</button>
        </div>

        <!-- Статистика -->
        <div class="tab-content active" id="tab-stats">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-label">Всего пользователей</div>
                    <div class="stat-value" id="statTotalUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Активных воркеров</div>
                    <div class="stat-value" id="statActiveWorkers">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">NFT передано</div>
                    <div class="stat-value" id="statNftTransferred">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Всего ⭐</div>
                    <div class="stat-value" id="statTotalStars">—</div>
                </div>
            </div>
        </div>

        <!-- Пользователи -->
        <div class="tab-content" id="tab-users">
            <input type="text" class="search-box" id="userSearch" placeholder="Поиск по ID, username или имени...">
            <div id="usersList" class="loading">
                <i class="ri-loader-4-line" style="font-size: 32px;"></i>
                <p>Загрузка...</p>
            </div>
        </div>

        <!-- Воркеры -->
        <div class="tab-content" id="tab-workers">
            <button class="btn btn-success btn-block" onclick="addWorker()" style="margin-bottom: 20px;">
                <i class="ri-add-line"></i> Добавить воркера
            </button>
            <div id="workersList" class="loading">
                <i class="ri-loader-4-line" style="font-size: 32px;"></i>
                <p>Загрузка...</p>
            </div>
        </div>

        <!-- Рассылка -->
        <div class="tab-content" id="tab-broadcast">
            <div class="broadcast-form">
                <div class="form-group">
                    <label class="form-label">Текст сообщения *</label>
                    <textarea class="form-textarea" id="broadcastText"
                        placeholder="Введите текст рассылки..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Фото (URL)</label>
                    <input type="text" class="form-input" id="broadcastPhoto"
                        placeholder="https://example.com/photo.jpg">
                </div>
                <div class="form-group">
                    <label class="form-label">Кнопка (текст)</label>
                    <input type="text" class="form-input" id="broadcastButtonText" placeholder="Открыть">
                </div>
                <div class="form-group">
                    <label class="form-label">Кнопка (ссылка)</label>
                    <input type="text" class="form-input" id="broadcastButtonUrl" placeholder="https://example.com">
                </div>
                <button class="btn btn-primary btn-block" onclick="previewBroadcast()">
                    <i class="ri-eye-line"></i> Предпросмотр
                </button>
                <button class="btn btn-success btn-block" onclick="sendBroadcast()" style="margin-top: 10px;">
                    <i class="ri-send-plane-fill"></i> Отправить всем
                </button>
            </div>
        </div>
    </div>

    <script src="/market/config.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#141414');
        tg.setBackgroundColor('#141414');

        // Переключение табов
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`tab-${tabName}`).classList.add('active');

                if (tabName === 'stats') loadStats();
                if (tabName === 'users') loadUsers();
                if (tabName === 'workers') loadWorkers();
            });
        });

        // Загрузка статистики
        async function loadStats() {
            try {
                console.log('[ADMIN] Загрузка статистики (заглушка)');
                document.getElementById('statTotalUsers').textContent = '—';
                document.getElementById('statActiveWorkers').textContent = '—';
                document.getElementById('statNftTransferred').textContent = '—';
                document.getElementById('statTotalStars').textContent = '—';
            } catch (error) {
                console.error('[ADMIN] Ошибка загрузки статистики:', error);
            }
        }

        // Загрузка пользователей
        async function loadUsers(search = '') {
            try {
                const usersList = document.getElementById('usersList');
                console.log('[ADMIN] Загрузка пользователей (заглушка)');
                usersList.innerHTML = `
                    <div class="empty-state">
                        <i class="ri-user-line" style="font-size: 48px; opacity: 0.3;"></i>
                        <p>Эндпоинты админ панели в разработке</p>
                        <p style="font-size: 12px; opacity: 0.5;">Необходимо реализовать /api/admin-panel/users</p>
                    </div>
                `;
            } catch (error) {
                console.error('[ADMIN] Ошибка загрузки пользователей:', error);
            }
        }

        // Загрузка воркеров
        async function loadWorkers() {
            try {
                const workersList = document.getElementById('workersList');
                console.log('[ADMIN] Загрузка воркеров (заглушка)');
                workersList.innerHTML = `
                    <div class="empty-state">
                        <i class="ri-user-settings-line" style="font-size: 48px; opacity: 0.3;"></i>
                        <p>Эндпоинты админ панели в разработке</p>
                        <p style="font-size: 12px; opacity: 0.5;">Необходимо реализовать /api/admin-panel/workers</p>
                    </div>
                `;
            } catch (error) {
                console.error('[ADMIN] Ошибка загрузки воркеров:', error);
            }
        }

        // Блокировка пользователя
        async function blockUser(userId) {
            if (!confirm(`Заблокировать пользователя ${userId}?`)) return;
            tg.showAlert('Функция в разработке');
        }

        // Разблокировка пользователя
        async function unblockUser(userId) {
            tg.showAlert('Функция в разработке');
        }

        // Добавление воркера
        async function addWorker() {
            const userId = prompt('Введите Telegram ID воркера:');
            if (!userId) return;
            tg.showAlert('Функция в разработке');
        }

        // Удаление воркера
        async function removeWorker(workerId) {
            if (!confirm('Удалить воркера?')) return;
            tg.showAlert('Функция в разработке');
        }

        // Предпросмотр рассылки
        async function previewBroadcast() {
            const text = document.getElementById('broadcastText').value;
            if (!text) {
                tg.showAlert('Введите текст сообщения');
                return;
            }
            tg.showAlert('Функция в разработке');
        }

        // Отправка рассылки
        async function sendBroadcast() {
            const text = document.getElementById('broadcastText').value;
            if (!text) {
                tg.showAlert('Введите текст сообщения');
                return;
            }
            if (!confirm('Отправить рассылку ВСЕМ пользователям?')) return;
            tg.showAlert('Функция в разработке');
        }

        // Поиск пользователей
        let searchTimeout;
        const userSearchInput = document.getElementById('userSearch');
        if (userSearchInput) {
            userSearchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    loadUsers(e.target.value);
                }, 500);
            });
        }

        // Инициализация
        console.log('[ADMIN] Инициализация админ панели');
        loadStats();
    </script>
</body>

</html>
